<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d7193f">
  <meta name="description" content="FutSENAI — registre partidas, monte times, acompanhe gols e compare estatísticas da sua turma.">
  <title>FutSENAI — Futebol entre amigos</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="FutSENAI - início">
        <span class="brand-mark">📛</span>
        <span class="brand-copy"><strong>Fut<span>SENAI</span></strong><small>FUTEBOL ENTRE AMIGOS</small></span>
      </a>
      <div class="side-label">MENU PRINCIPAL</div>
      <nav class="main-nav" aria-label="Navegação principal">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">▦</span><span>Visão geral</span></button>
        <button class="nav-item" data-view="players"><span class="nav-icon">♟</span><span>Jogadores</span><span class="nav-count" id="navPlayerCount">0</span></button>
        <button class="nav-item" data-view="matches"><span class="nav-icon">⚑</span><span>Partidas</span></button>
        <button class="nav-item" data-view="stats"><span class="nav-icon">↗</span><span>Estatísticas</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="season-card">
          <div class="season-ball">🏆</div>
          <div><strong>Temporada em andamento</strong><p>Cada jogo vale uma história.</p></div>
        </div>
        <div class="sidebar-foot"><span class="status-dot"></span> Banco de dados local conectado</div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Abrir menu">☰</button>
        <div class="breadcrumb"><span>FutSENAI</span><span class="crumb-slash">/</span><strong id="pageCrumb">Visão geral</strong></div>
        <div class="topbar-actions"><div class="today-chip"><span>◷</span><span id="todayLabel">Hoje</span></div><button class="avatar-button" id="quickAddPlayer" title="Cadastrar jogador">＋</button></div>
      </header>

      <div class="page-content" id="pageContent">
        <div class="loading-state"><div class="spinner"></div><p>Preparando o campo...</p></div>
      </div>
      <footer class="app-footer"><span>FutSENAI <b>•</b> Feito para a resenha depois do jogo.</span><span>Seus registros ficam no banco local desta aplicação.</span></footer>
    </main>
  </div>
  <div class="modal-root" id="modalRoot" aria-live="polite"></div>
  <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>
  <script src="/app.js" defer></script>
</body>
</html>
